[project]
name = "lucifer-lab"
version = "0.1.0"
description = "A small laboratory that tests one claim: does an AI agent measurably improve on future tasks by learning from its own experience?"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lucifer = "lucifer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lucifer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
