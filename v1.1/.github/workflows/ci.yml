name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q

  reproduce:
    # Reruns M2-M6 and M8 from scratch and fails if any registered verdict differs from the committed results (python -m lucv11.reproduce).
    # Numbers are compared too and reported; on another platform they may differ in the last digits, verdicts must not.
    if: github.event_name == 'workflow_dispatch'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e .
      - run: python -m lucv11.reproduce reproduction.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reproduction
          path: reproduction.json
